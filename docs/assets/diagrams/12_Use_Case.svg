<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690"><title>Use cases and the six default user roles</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#335d4e"/></marker></defs><rect width="1200" height="690" fill="white"/><text x="600" y="38" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" text-anchor="middle" font-weight="bold" fill="#172b26">CivicFlow use case view</text><rect x="260" y="70" width="680" height="550" fill="#fafcfb" stroke="#668377"/><text x="600" y="100" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" text-anchor="middle" font-weight="bold" fill="#172b26">Service delivery platform</text><ellipse cx="420" cy="165" rx="155" ry="42" fill="white" stroke="#335d4e" stroke-width="1.6"/><text x="420" y="171" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" text-anchor="middle" font-weight="normal" fill="#172b26">Find services and guidance</text><ellipse cx="770" cy="165" rx="155" ry="42" fill="white" stroke="#335d4e" stroke-width="1.6"/><text x="770" y="171" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" text-anchor="middle" font-weight="normal" fill="#172b26">Register and secure account</text><ellipse cx="420" cy="280" rx="155" ry="42" fill="white" stroke="#335d4e" stroke-width="1.6"/><text x="420" y="286" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" text-anchor="middle" font-weight="normal" fill="#172b26">Submit and track requests</text><ellipse cx="770" cy="280" rx="155" ry="42" fill="white" stroke="#335d4e" stroke-width="1.6"/><text x="770" y="286" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" text-anchor="middle" font-weight="normal" fill="#172b26">Review and record decisions</text><ellipse cx="420" cy="395" rx="155" ry="42" fill="white" stroke="#335d4e" stroke-width="1.6"/><text x="420" y="401" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" text-anchor="middle"