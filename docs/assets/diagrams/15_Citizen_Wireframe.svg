<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750"><title>Citizen workspace wireframe showing navigation, search and request history</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#335d4e"/></marker></defs><rect width="1200" height="750" fill="white"/><text x="600" y="35" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" text-anchor="middle" font-weight="bold" fill="#172b26">Citizen workspace design wireframe</text><rect x="35" y="65" width="1130" height="65" rx="5" fill="#e9f1ed" stroke="#55766a" stroke-width="1.5"/><text x="600.0" y="103.5" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" text-anchor="middle" font-weight="normal" fill="#172b26">CivicFlow     Services     Help                                  Account menu</text><rect x="35" y="155" width="220" height="515" rx="5" fill="#f4f7f6" stroke="#55766a" stroke-width="1.5"/><text x="145.0" y="366.5" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" text-anchor="middle" font-weight="normal" fill="#172b26">Dashboard</text><text x="145.0" y="392.5" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" text-anchor="middle" font-weight="normal" fill="#172b26">My requests</text><text x="145.0" y="418.5" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" text-anchor="middle" font-weight="normal" fill="#172b26">New request</text><text x="145.0" y="444.5" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" text-anchor="middle" font-weight="normal" fill="#172b26">Notifications</text><text x="145.0" y="470.5" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" text-anchor="middle" font-weight="normal" fill="#172b26">Profile and security</text><text x="290" y="190" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" text-anchor="start" font-weight="bold" fill="#172b26">My service requests</text><text x="290" y="227" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" text-anchor="start" font-weight="normal" fill="#172b26">Filter by status, service and reference</text><rect x="290" y="250" width="840" height="60" rx="5" fill="white" stroke="#55766a" stroke-width="1.5"/><text x="710.0" y="286.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" text-anchor="middle" font-weight="normal" fill="#172b26">Search request reference          Status          Search</text><rect x="290" y="335" width="840" height="230" rx="5" fill="white" stroke="#55766a" stroke-width="1.5"/><text x="710.0" y="417.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" text-anchor="middle" font-weight="normal" fill="#172b26">Reference       Service       Current status       Next action</text><text x="710.0" y="443.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" text-anchor="middle" font-weight="normal" fill="#172b26">GOV reference     Complaint     In review            Open record</text><text x="710.0" y="469.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" text-anchor="middle" font-weight="normal" fill="#172b26">GOV reference     Permit        Needs information    Reply</text><text x="710.0" y="495.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" text-anchor="middle" font-weight="normal" fill="#172b26">GOV reference     Complaint     Resolved             Feedback</text><text x="290" y="615" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" text-anchor="start" font-weight="normal" fill="#172b26">Permitted actions appear after an authorised record is opened.</text><text x="600" y="715" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" text-anchor="middle" font-weight="normal" fill="#172b26">Design wireframe for documentation. Content and labels are illustrative.</text></svg>