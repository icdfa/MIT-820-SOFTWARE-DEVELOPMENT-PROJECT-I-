<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850"><title>Sequence of complaint submission, review, information request and response</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#335d4e"/></marker></defs><rect width="1200" height="850" fill="white"/><text x="600" y="38" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" text-anchor="middle" font-weight="bold" fill="#172b26">Complaint submission and information reply sequence</text><rect x="5" y="65" width="250" height="65" rx="5" fill="#f4f7f6" stroke="#55766a" stroke-width="1.5"/><text x="130.0" y="103.5" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" text-anchor="middle" font-weight="normal" fill="#172b26">Citizen</text><path d="M130,130 V780" stroke="#9eb2a8" stroke-dasharray="6 6"/><rect x="315" y="65" width="250" height="65" rx="5" fill="#f4f7f6" stroke="#55766a" stroke-width="1.5"/><text x="440.0" y="103.5" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" text-anchor="middle" font-weight="normal" fill="#172b26">Portal and access checks</text><path d="M440,130 V780" stroke="#9eb2a8" stroke-dasharray="6 6"/><rect x="625" y="65" width="250" height="65" rx="5" fill="#f4f7f6" stroke="#55766a" stroke-width="1.5"/><text x="750.0" y="103.5" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" text-anchor="middle" font-weight="normal" fill="#172b26">Database and event history</text><path d="M750,130 V780" stroke="#9eb2a8" stroke-dasharray="6 6"/><rect x="935" y="65" width="250" height="65" rx="5" fill="#f4f7f6" stroke="#55766a" stroke-width="1.5"/><text x="1060.0" y="103.5" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" text-anchor="middle" font-weight="normal" fill="#172b26">Department officer</text><path d="M1060,130 V780" stroke="#9eb2a8" stroke-dasharray="6 6"/><path d="M130,185 L440,185" fill="none" stroke="#335d4e" stroke-width="2" marker-end="url(#arrow)"/><text x="285.0" y="177.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#172b26">Submit completed complaint</text><path d="M440,245 L750,245" fill="none" stroke="#335d4e" stroke-width="2" marker-end="url(#arrow)"/><text x="595.0" y="237.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#172b26">Create request, target and event</text><path d="M750,305 L440,305" fill="none" stroke="#335d4e" stroke-width="2" marker-end="url(#arrow)"/><text x="595.0" y="297.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#172b26">Return stable reference</text><path d="M440,365 L130,365" fill="none" stroke="#335d4e" stroke-width="2" marker-end="url(#arrow)"/><text x="285.0" y="357.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#172b26">Show private receipt and tracking code</text><path d="M1060,445 L440,445" fill="none" stroke="#335d4e" stroke-width="2" marker-end="url(#arrow)"/><text x="750.0" y="437.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#172b26">Start review and request information</text><path d="M440,505 L750,505" fill="none" stroke="#335d4e" stroke-width="2" marker-end="url(#arrow)"/><text x="595.0" y="497.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#172b26">Check scope and version, save reason</text><path d="M130,585 L440,585" fill="none" stroke="#335d4e" stroke-width="2" marker-end="url(#arrow)"/><text x="285.0" y="577.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#172b26">Reply within owned request</text><path d="M440,645 L750,645" fill="none" stroke="#335d4e" stroke-width="2" marker-end="url(#arrow)"/><text x="595.0" y="637.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#172b26">Record reply and return to Submitted</text><path d="M1060,705 L440,705" fill="none" stroke="#335d4e" stroke-width="2" marker-end="url(#arrow)"/><text x="750.0" y="697.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#172b26">Review and record reasoned resolution</text><text x="600" y="820" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" text-anchor="middle" font-weight="normal" fill="#172b26">Invalid permission, stale version or failed transaction leaves the request unchanged.</text></svg>