<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860"><title>Single instance hosting, private data and scheduled integration topology</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#335d4e"/></marker></defs><rect width="1200" height="860" fill="white"/><text x="600" y="38" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" text-anchor="middle" font-weight="bold" fill="#172b26">Single instance deployment topology</text><rect x="350" y="75" width="500" height="70" rx="5" fill="#f4f7f6" stroke="#55766a" stroke-width="1.5"/><text x="600.0" y="103.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" text-anchor="middle" font-weight="normal" fill="#172b26">Citizen and staff browsers</text><text x="600.0" y="129.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" text-anchor="middle" font-weight="normal" fill="#172b26">HTTPS and extension free routes</text><rect x="100" y="200" width="1000" height="430" fill="#fafcfb" stroke="#668377" stroke-width="2"/><text x="130" y="232" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" text-anchor="start" font-weight="bold" fill="#172b26">cPanel or compatible Linux host</text><rect x="345" y="260" width="510" height="70" rx="5" fill="#f4f7f6" stroke="#55766a" stroke-width="1.5"/><text x="600.0" y="301.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" text-anchor="middle" font-weight="normal" fill="#172b26">Apache or LiteSpeed and PHP 8.2 or newer</text><rect x="150" y="390" width="260" height="90" rx="5" fill="#f4f7f6" stroke="#55766a" stroke-width="1.5"/><text x="280.0" y="428.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" text-anchor="middle" font-weight="normal" fill="#172b26">MySQL or MariaDB</text><text x="280.0" y="454.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" text-anchor="middle" font-weight="normal" fill="#172b26">21 application tables</text><rect x="470" y="390" width="260" height="90" rx="5" fill="#f4f7f6" stroke="#55766a" stroke-width="1.5"/><text x="600.0" y="428.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" text-anchor="middle" font-weight="normal" fill="#172b26">Private storage</text><text x="600.0" y="454.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" text-anchor="middle" font-weight="normal" fill="#172b26">Uploads and sessions</text><rect x="790" y="390" width="260" height="90" rx="5" fill="#f4f7f6" stroke="#55766a" stroke-width="1.5"/><text x="920.0" y="428.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" text-anchor="middle" font-weight="normal" fill="#172b26">CLI worker</text><text x="920.0" y="454.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" text-anchor="middle" font-weight="normal" fill="#172b26">Cron every five minutes</text><rect x="345" y="530" width="510" height="65" rx="5" fill="#f4f7f6" stroke="#55766a" stroke-width="1.5"/><text x="600.0" y="568.5" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" text-anchor="middle" font-weight="normal" fill="#172b26">Protected configuration and installation lock</text><path d="M600,145 L600,260" fill="none" stroke="#335d4e" stroke-width="2" marker-end="url(#arrow)"/><path d="M470,330 L280,390" fill="none" stroke="#335d4e" stroke-width="2" marker-end="url(#arrow)"/><path d="M600,330 L600,390" fill="none" stroke="#335d4e" stroke-width="2" marker-end="url(#arrow)"/><path d="M730,330 L920,390" fill="none" stroke="#335d4e" stroke-width="2" marker-end="url(#arrow)"/><rect x="150" y="710" width="400" height="80" rx="5" fill="#f4f7f6" stroke="#55766a" stroke-width="1.5"/><text x="350.0" y="743.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" text-anchor="middle" font-weight="normal" fill="#172b26">Notification providers</text><text x="350.0" y="769.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" text-anchor="middle" font-weight="normal" fill="#172b26">SMTP email and Termii SMS</text><rect x="650" y="710" width="400" height="80" rx="5" fill="#f4f7f6" stroke="#55766a" stroke-width="1.5"/><text x="850.0" y="743.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" text-anchor="middle" font-weight="normal" fill="#172b26">Optional AI provider</text><text x="850.0" y="769.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" text-anchor="middle" font-weight="normal" fill="#172b26">Public context from PHP request</text><path d="M920,480 V660 H350 V710" fill="none" stroke="#335d4e" stroke-width="2" marker-end="url(#arrow)"/><path d="M855,295 H1150 V680 H850 V710" fill="none" stroke="#335d4e" stroke-width="2" marker-end="url(#arrow)"/><text x="600" y="840" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" text-anchor="middle" font-weight="normal" fill="#172b26">Single host baseline with protected configuration and independently configured providers.</text></svg>